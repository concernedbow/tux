[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tux-agent"
dynamic = ["version"]
description = "An AI assistant that diagnoses and fixes problems on your Linux machine, powered by Claude."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["anthropic>=1.11", "rich>=13"]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Systems Administration",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tux = "tux_app.cli:main"
tux-monitor = "tux.monitor:main"

[project.urls]
Homepage = "https://github.com/concernedbow/tux"

[tool.setuptools.dynamic]
version = { attr = "tux.__version__" }

# The Claude Code plugin lives in plugin/ and ships only what it runs (the `tux` core: safety
# classifier, diagnostics, journal, monitor). The API-key terminal app is a separate package.
[tool.setuptools]
package-dir = { "tux" = "plugin/tux", "tux_app" = "app/tux_app" }
packages = ["tux", "tux_app"]
